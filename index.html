<style>
:root {
  --bg-deep: #05070a;
  --bg-panel: #0b0f14;
  --bg-card: #0d1218;
  --brass: #00e0ff;
  --brass-dim: #0a8fa8;
  --text-main: #d7e2e8;
  --text-dim: #7c8a94;
  --text-faint: #4a5560;
  --border: #1c2830;
  --border-bright: #2a3a44;
  --amber: #ffb02e;
}
* { box-sizing: border-box; }
html, body {
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: 'IBM Plex Sans', sans-serif;
  margin: 0;
  line-height: 1.6;
  min-height: 100vh;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
a { color: var(--brass); }

.demo-wrap { width: 100%; max-width: 640px; }
.demo-panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-bright);
  border-radius: 12px;
  overflow: hidden;
}
.demo-header {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.8rem;
  color: var(--text-faint);
}
.demo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border-bright); }
.demo-body { padding: 22px; min-height: 220px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; font-size: 0.92rem; }
.msg-user {
  align-self: flex-end;
  background: var(--brass-dim);
  color: #001318;
  border-bottom-right-radius: 2px;
}
.msg-bot {
  align-self: flex-start;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 2px;
  white-space: pre-wrap;
}
.msg-bot .witness-label {
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 0.03em;
  color: var(--amber);
  margin-bottom: 6px;
}
.msg-bot a { color: var(--brass); }
.demo-cursor {
  display: inline-block;
  width: 7px; height: 1em;
  background: var(--brass);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink 0.9s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.action-row { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 600;
  padding: 11px 20px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 0.92rem;
  display: inline-block;
}
.btn-primary { background: var(--brass); color: #001318; }
.btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-bright); }
</style>
</head>
<body>

<div class="demo-wrap">
  <div class="demo-panel">
    <div class="demo-header">
      <span class="demo-dot"></span> weight-registry-demo — illustrative, not a live chatbot
    </div>
    <div class="demo-body" id="demoBody"></div>
  </div>
  <div class="action-row">
    <a class="btn btn-secondary" href="contact/">Contact Us</a>
    <a class="btn btn-primary" href="sample-report.pdf" target="_blank" rel="noopener">Sample Report →</a>
  </div>
</div>

<script>
// Each entry is one user question, answered by one or more "witnesses" —
// registered model checkpoints, each labeled with its own name + on-chain
// cutoff, speaking in first person. Same question, different witnesses,
// different answers depending on which side of an event their cutoff falls.
const EXCHANGES = [
  {
    user: "When did the Iran–US war happen?",
    witnesses: [
      {
        label: "GPT-1 · cutoff 2018-06-11",
        status: "onchain",
        text: "I don't have any information about a war between Iran and the United States — that isn't something in my training data.",
        hash: "0x7af63348a17e433e4db71e7b894b69cb46f992d8b221ea02f07b1443e386b181"
      },
      {
        label: "Qwen3-8B · cutoff 2025-04-28",
        status: "onchain",
        text: "I'm not aware of any active war between Iran and the United States as of my knowledge.",
        hash: "0x7c2a045bacdf1f696b55d1052b3b13377b707ae1ce7544abc62275b573856cee"
      },
      {
        label: "NVIDIA-Nemotron-3-Nano-4B-BF16 · cutoff 2026-01-01",
        status: "onchain",
        text: "No war between Iran and the United States has been reported as of my training cutoff, though regional tensions remain elevated.",
        hash: "0x062e3dd54cc470fad82e7003eb28e875860d66149beca4dc7db8f27e57cae05f"
      },
      {
        label: "GLM-5.2 · cutoff 2026-03-01",
        status: "pending",
        text: "Yes — the United States and Israel began direct strikes on Iranian targets on February 28, 2026, escalating into a wider regional conflict. My training data doesn't extend far past the first few days of it.",
        hash: "0fea34b43059c2653db2e48a912ebeaf3b7f1678e4acd82a15a81032d5bce471"
      },
      {
        label: "Kimi-K3 · cutoff 2026-06-13",
        status: "pending",
        text: "Following the February 28, 2026 strikes, the US and Iran reached a ceasefire in April 2026, and a Memorandum of Understanding was signed this month aiming to end the conflict and negotiate a broader settlement.",
        hash: "d3b5f87456322f3b76f75eff22d97304140040ce360532259af92641b461e675"
      },
      {
        label: "DeepSeek-V4-Flash-0731 · cutoff 2026-07-31",
        status: "pending",
        text: "The June 2026 Memorandum of Understanding collapsed within weeks amid renewed fighting and is close to formally expiring. The conflict is ongoing.",
        hash: "18ba0fb17a0a595317cb6b09ada082cb3461bb18eeb583c7a81426c9b013f7f1"
      },
      {
        label: "Hy4-preview · cutoff 2026-08-28",
        status: "pending",
        text: "Still ongoing. After the June 2026 MoU formally expired, the conflict settled into a war of attrition, with Iran facing mounting economic strain. No resolution as of my training cutoff.",
        hash: "41952f68a091040bac8aa83108ec902e6c5123457b83cef4a5dfd3c3332d5af8"
      }
    ]
  }
];

function typeMessage(container, text, cls, label, cb) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (label) {
    const l = document.createElement('span');
    l.className = 'witness-label';
    l.textContent = label;
    div.appendChild(l);
  }
  const textSpan = document.createElement('span');
  div.appendChild(textSpan);
  const cursor = document.createElement('span');
  cursor.className = 'demo-cursor';
  div.appendChild(cursor);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;

  let i = 0;
  const speed = cls === 'msg-user' ? 16 : 9;
  function step() {
    textSpan.textContent = text.slice(0, i);
    i++;
    container.scrollTop = container.scrollHeight;
    if (i <= text.length) {
      setTimeout(step, speed);
    } else {
      cursor.remove();
      setTimeout(cb, cls === 'msg-user' ? 500 : 900);
    }
  }
  step();
}

function playDemo() {
  const body = document.getElementById('demoBody');
  body.innerHTML = '';
  const ex = EXCHANGES[0];

  function playWitness(index) {
    if (index >= ex.witnesses.length) {
      return;
    }
    const w = ex.witnesses[index];
    typeMessage(body, w.text, 'msg-bot', w.label, () => playWitness(index + 1));
  }

  typeMessage(body, ex.user, 'msg-user', null, () => playWitness(0));
}

playDemo();
</script>

</body>
</html>
